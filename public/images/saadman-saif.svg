<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1208"/>
      <stop offset="100%" style="stop-color:#0a0804"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4940a"/>
      <stop offset="50%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#d4940a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>
  <text x="200" y="220" font-family="Georgia, serif" font-size="120" font-weight="300" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">SS</text>
  <text x="200" y="260" font-family="monospace" font-size="12" fill="#996600" text-anchor="middle" letter-spacing="0.3em">SAADMAN SAIF</text>
</svg>
